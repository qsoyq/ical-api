name: Feature request
description: Propose a new capability or behavior change.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Context and user need.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome this issue should deliver.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include in-scope and out-of-scope work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Commands, tests, or manual checks.
    validations:
      required: true
